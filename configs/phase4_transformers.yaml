# Run: python -m src.models.run_phase4 [--only SCENARIO ...] [--models MODEL ...] [--seeds SEED ...]
#
# Transformer fine-tuning experiments.
#
# Models:
#   mbert     - bert-base-multilingual-cased
#   xlmr      - xlm-roberta-base
#   afroxlmr  - Davlan/afro-xlmr-base
#   naijaxlmt - manueltonneau/naija-xlm-twitter-base   (XLM-R further pretrained on Nigerian tweets)
#   bertweet  - vinai/bertweet-base                    (English-only Twitter-pretrained BERT)
#
# Scenarios:
#   monolingual        - train + test same language
#   multilingual_joint - train on all languages, eval overall + per-language
#   zero_shot          - train English only, test on each African language
#   few_shot           - English + N native target examples, test on target

seeds: [42, 123, 2024]

models: [mbert, xlmr, afroxlmr, naijaxlmt, bertweet]

train:
  epochs: 3
  batch_size: 16
  lr: 2.0e-5
  max_length: 128

scenarios:
  - name: monolingual
    languages: [English, Yoruba, Igbo, Hausa]

  - name: multilingual_joint
    train_languages: [English, Yoruba, Igbo, Hausa]
    eval_per_language: true

  - name: zero_shot
    train_language: English
    test_languages: [Yoruba, Igbo, Hausa]

  - name: few_shot
    base_train_language: English
    target_languages: [Yoruba, Igbo, Hausa]
    shots: [50, 100, 500]
